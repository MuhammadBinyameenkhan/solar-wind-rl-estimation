env:
  episode_s: 30.0
  agent_dt_s: 0.05
  sim_dt_s: 0.002
  headroom_constraint: true
  projection: band_power
  param_filter_s: 0.25
  action_dims: 2
  action_mode: residual
  residual_base: tuned
  terminate_dev_hz: 3.0
  reward:
    f_band_hz: 0.2
    rocof_band_hz_s: 1.0
    w_freq_inband: 0.02
    w_freq: 1.0
    w_rocof: 0.5
    w_bess: 0.1
    w_fast: 2.0
    w_sat: 2.0
    w_violation: 1.0
    w_action_mag: 0.05
    w_action_rate: 0.3
    collapse_penalty: 50.0
train:
  algo: td3
  episodes: 500
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  hidden:
  - 256
  - 256
  actor_lr: 0.0001
  actor_zero_init: true
  critic_lr: 0.001
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  buffer_size: 1000000
  warmup_steps: 10000
  updates_per_step: 0.5
  expl_noise: 0.1
  expl_noise_final: 0.03
  policy_noise: 0.2
  noise_clip: 0.5
  policy_delay: 2
  eval_every: 50
  eval_episodes: 20
  device: cpu
  out_dir: study3_ieee33/runs_hp
eval:
  n_scenarios: 200
  scenario_seed: 20260
  controllers:
  - fixed
  - fixed_tuned
  - fixed_feasible
  - bang_bang
  - adaptive_rocof
  - adaptive_dir
  - fuzzy
  - ddpg
  - td3
  baseline_params:
    fixed_tuned:
      h: 3.0
      d: 10.0
      alpha: 0.3
    bang_bang:
      h_big: 4.0
      h_small: 3.0
    adaptive_rocof:
      k_h: 0.0
      k_d: 0.0
    adaptive_dir:
      k_h: 0.0
      k_d: 0.0
    fuzzy:
      k_h: 0.0
      k_d: 0.0
  out_dir: study3_ieee33/results
  adaptive_base: tuned
