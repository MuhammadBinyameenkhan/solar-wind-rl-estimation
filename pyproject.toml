[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vsgrl"
version = "0.2.0"
description = "RL-driven Virtual Synchronous Generator control for low-inertia PV-Wind-BESS microgrids"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7", "gymnasium>=0.29", "torch>=2.1", "pyyaml>=6.0", "xarray>=2023.1", "netCDF4>=1.6"]

[tool.setuptools.packages.find]
include = ["vsgrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
